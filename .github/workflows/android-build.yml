name: FANEVA V2 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - automation/release-signing-run16
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: faneva-v2-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Unit tests and Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-36.1" \
                     "build-tools;36.0.0"

      - name: Prepare temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey
          echo "DEBUG_KEYSTORE_VERIFIED=$KEYSTORE"

      - name: Run debug unit tests
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

      - name: Prepare release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          umask 077
          printf "%s" "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/faneva-release.jks"
          test -s "$RUNNER_TEMP/faneva-release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/faneva-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease

      - name: Verify release APK and checksum
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release-signature.txt
          ACTUAL=$(grep -m1 "Signer #1 certificate SHA-256 digest:" release-signature.txt | sed "s/.*: //" | tr -d ":[:space:]" | tr "[:upper:]" "[:lower:]")
          EXPECTED="c07b9cb863fb326a0b5af9c236786755043f6ee06f025fa1d9c89d487f3ed464"
          test "$ACTUAL" = "$EXPECTED"
          BADGING=$("$AAPT" dump badging "$APK")
          printf "%s\n" "$BADGING" | grep -F "package: name='com.aistudio.fanevasystem.qxkp7z'"
          printf "%s\n" "$BADGING" | grep -F "versionCode='5'"
          printf "%s\n" "$BADGING" | grep -F "versionName='1.4'"
          sha256sum "$APK" > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Clean up release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/faneva-release.jks"

      - name: Upload signed release artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: faneva-v2-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            release-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build debug APK
        id: apk
        if: always() && !cancelled()
        shell: bash
        run: |
          if ./gradlew --no-daemon --console=plain :app:assembleDebug; then
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              sha256sum app/build/outputs/apk/debug/app-debug.apk
              ls -lh app/build/outputs/apk/debug/app-debug.apk
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "ERROR: APK not found after build."
              exit 1
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload debug APK artifact
        if: always() && !cancelled() && steps.apk.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: faneva-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
